services:
  db:
    image: postgres:16-alpine
    container_name: ferias-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ferias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferias}
      POSTGRES_DB: ${POSTGRES_DB:-ferias}
    volumes:
      - ferias_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ferias}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ferias-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_INSECURE_PRODUCTION_COOKIE: ${ALLOW_INSECURE_PRODUCTION_COOKIE:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12}
      FRONTEND_URL: ${FRONTEND_URL:-http://chat-server}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ferias}:${POSTGRES_PASSWORD:-ferias}@db:5432/${POSTGRES_DB:-ferias}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD_FILE: /run/secrets/gmail_app_password
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      ENVIOS_MONITORAMENTO_INTERVALO_MINUTOS: ${ENVIOS_MONITORAMENTO_INTERVALO_MINUTOS:-20}
    secrets:
      - gmail_app_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./uploads:${UPLOAD_DIR:-/app/uploads}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_DOCKER_API_URL:-/api}
    container_name: ferias-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    build:
      context: ./backend
    restart: "no"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_INSECURE_PRODUCTION_COOKIE: ${ALLOW_INSECURE_PRODUCTION_COOKIE:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ferias}:${POSTGRES_PASSWORD:-ferias}@db:5432/${POSTGRES_DB:-ferias}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

volumes:
  ferias_data:

secrets:
  # Arquivo local com a Senha de App de 16 dígitos do Gmail (2FA ativado), uma linha, sem
  # quebra de linha ao final. Nunca commitar - ver .gitignore. Em Portainer/Compose puro
  # isso é um bind-mount do arquivo do host; se o Portainer estiver em modo Swarm/stack, o
  # mecanismo de secrets é outro (docker secret create) - confirmar antes do deploy.
  gmail_app_password:
    file: ./secrets/gmail_app_password.txt
