services:
  db:
    image: postgres:16-alpine
    container_name: ferias-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ferias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferias}
      POSTGRES_DB: ${POSTGRES_DB:-ferias}
    volumes:
      - ferias_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ferias}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ferias-backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      FRONTEND_URL: ${FRONTEND_URL:-http://chat-server}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ferias}:${POSTGRES_PASSWORD:-ferias}@db:5432/${POSTGRES_DB:-ferias}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://chat-server:8000}
    container_name: ferias-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  ferias_data:
