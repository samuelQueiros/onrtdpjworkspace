services:
  backend:
    build:
      context: ./backend
    container_name: ferias-backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-em-producao}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      FRONTEND_URL: ${FRONTEND_URL:-http://chat-server}
      DATABASE_PATH: /app/data/ferias.db
    volumes:
      - ferias_data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://chat-server:8000}
    container_name: ferias-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  ferias_data:
