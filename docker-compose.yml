services:
  db:
    image: postgres:16-alpine
    container_name: ferias-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ferias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferias}
      POSTGRES_DB: ${POSTGRES_DB:-ferias}
    volumes:
      - ferias_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ferias}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ferias-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_INSECURE_PRODUCTION_COOKIE: ${ALLOW_INSECURE_PRODUCTION_COOKIE:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12}
      FRONTEND_URL: ${FRONTEND_URL:-http://chat-server}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ferias}:${POSTGRES_PASSWORD:-ferias}@db:5432/${POSTGRES_DB:-ferias}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:${UPLOAD_DIR:-/app/uploads}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: ferias-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ferias_data:
