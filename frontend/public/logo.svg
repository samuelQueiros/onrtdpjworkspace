<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="38%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#4ade80"/>
      <stop offset="45%"  stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </radialGradient>
    <radialGradient id="sphere" cx="30%" cy="28%" r="70%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle-clip">
      <circle cx="32" cy="32" r="32"/>
    </clipPath>
  </defs>

  <!-- base circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- dark blue lower region -->
  <ellipse cx="38" cy="46" rx="24" ry="20" fill="#1d4ed8" opacity="0.55" clip-path="url(#circle-clip)"/>

  <!-- white wave divider -->
  <path d="M0 36 Q16 20 32 32 Q48 44 64 28 L64 64 L0 64 Z"
        fill="#0f172a" opacity="0.18" clip-path="url(#circle-clip)"/>

  <!-- specular highlight -->
  <circle cx="32" cy="32" r="32" fill="url(#sphere)"/>

  <!-- thin border -->
  <circle cx="32" cy="32" r="31" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
</svg>
