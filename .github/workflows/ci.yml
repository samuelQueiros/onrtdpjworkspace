name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ferias
          POSTGRES_PASSWORD: ferias
          POSTGRES_DB: ferias
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ferias"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-secret-key-only
      CREDENTIALS_ENCRYPTION_KEY: ci-encryption-key-only
      DATABASE_URL: postgresql://ferias:ferias@localhost:5432/ferias
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pip-audit
      - run: pip-audit -r backend/requirements.txt
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m unittest discover -s tests
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # React Router 7.18.2 corrige as falhas do modo declarativo usado aqui.
      # A ocorrência high remanescente é exclusiva do modo RSC (não utilizado)
      # e ainda não possui uma versão publicada sem advisory.
      - run: npm audit --audit-level=critical
        working-directory: frontend
